<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page Not Found | Krishna Kumar</title>
    <style>
      :root {
        --bg: #080808;
        --panel: #131313;
        --text: #f5f7fb;
        --accent: #0096ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Arial, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at 20% 20%, #121f33 0%, var(--bg) 45%, #050505 100%);
        padding: 2rem;
      }

      .card {
        width: min(560px, 100%);
        background: var(--panel);
        border: 1px solid rgba(0, 150, 255, 0.35);
        border-radius: 16px;
        padding: 2rem;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 5vw, 2.8rem);
        color: var(--accent);
      }

      p {
        margin: 0 0 1.2rem;
        line-height: 1.6;
        color: #dde6f4;
      }

      a {
        display: inline-block;
        text-decoration: none;
        color: #071d35;
        background: var(--accent);
        padding: 0.8rem 1.15rem;
        border-radius: 999px;
        font-weight: 700;
      }

      a:focus-visible,
      a:hover {
        transform: translateY(-1px);
        box-shadow: 0 0 0 4px rgba(0, 150, 255, 0.25);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>404</h1>
      <p>The page you requested could not be found.</p>
      <p>It may have been moved, deleted, or the URL may be incorrect.</p>
      <a href="./index.html">Back to Portfolio</a>
    </main>
  </body>
</html>
